name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Stage BepInEx libs from vendor zip
        shell: pwsh
        run: |
          # Use the same zip install.cmd will extract at runtime so the
          # CI-built DLL references match the runtime BepInEx version
          # exactly (no 5.4.23.x cross-patch binding surprises).
          $vendorZip = "vendor/bepinex/BepInEx_win_x86.zip"
          if (-not (Test-Path $vendorZip)) {
            Write-Host "::error::Vendored BepInEx zip missing: $vendorZip"
            exit 1
          }

          $libsPath = "src/ObraDinnHeadTracking/libs"
          New-Item -ItemType Directory -Path $libsPath -Force | Out-Null
          Expand-Archive -Path $vendorZip -DestinationPath bepinex-temp -Force
          Copy-Item bepinex-temp/BepInEx/core/BepInEx.dll $libsPath/
          Copy-Item bepinex-temp/BepInEx/core/0Harmony.dll $libsPath/
          Remove-Item -Recurse bepinex-temp

          Write-Host "BepInEx DLLs staged from $vendorZip" -ForegroundColor Green

      - name: Build Unity stub assemblies
        shell: pwsh
        # Same script local devs run via `pixi run setup-libs`, so CI IL
        # and local IL stay in lockstep. If you change the stub layout,
        # change it in scripts/build-unity-stubs.ps1, not here.
        run: scripts/build-unity-stubs.ps1 -LibsPath src/ObraDinnHeadTracking/libs

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $unityPath = "${{ github.workspace }}\src\ObraDinnHeadTracking\libs"
          dotnet restore src/ObraDinnHeadTracking/ObraDinnHeadTracking.csproj "-p:UnityEnginePath=$unityPath"

      - name: Build Debug
        shell: pwsh
        run: |
          Write-Host "Building debug configuration..." -ForegroundColor Cyan
          $unityPath = "${{ github.workspace }}\src\ObraDinnHeadTracking\libs"
          dotnet build src/ObraDinnHeadTracking/ObraDinnHeadTracking.csproj --configuration Debug "-p:UnityEnginePath=$unityPath"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Debug build failed"
            exit 1
          }

          Write-Host "Debug build succeeded" -ForegroundColor Green

      - name: Build Release
        shell: pwsh
        run: |
          Write-Host "Building release configuration..." -ForegroundColor Cyan
          $unityPath = "${{ github.workspace }}\src\ObraDinnHeadTracking\libs"
          dotnet build src/ObraDinnHeadTracking/ObraDinnHeadTracking.csproj --configuration Release "-p:UnityEnginePath=$unityPath"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Release build failed"
            exit 1
          }

          Write-Host "Release build succeeded" -ForegroundColor Green

      - name: Verify build outputs
        shell: pwsh
        run: |
          Write-Host "Verifying build outputs..." -ForegroundColor Cyan

          $requiredFiles = @(
            "src/ObraDinnHeadTracking/bin/Debug/net35/ObraDinnHeadTracking.dll",
            "src/ObraDinnHeadTracking/bin/Release/net35/ObraDinnHeadTracking.dll"
          )

          $allExist = $true
          foreach ($file in $requiredFiles) {
            if (Test-Path $file) {
              $size = (Get-Item $file).Length / 1KB
              Write-Host "  $file ($([math]::Round($size, 2)) KB)" -ForegroundColor Green
            } else {
              Write-Host "  Missing: $file" -ForegroundColor Red
              $allExist = $false
            }
          }

          if (-not $allExist) {
            Write-Host "::error::Some build outputs are missing"
            exit 1
          }

          Write-Host "All build outputs verified" -ForegroundColor Green

      - name: Package installer
        shell: pwsh
        run: |
          Write-Host "Packaging installer ZIP..." -ForegroundColor Cyan
          powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Packaging failed"
            exit 1
          }

          Write-Host "Package created" -ForegroundColor Green

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ObraDinnHeadTracking-installer
          path: release/*-installer.zip
          retention-days: 14
          if-no-files-found: error

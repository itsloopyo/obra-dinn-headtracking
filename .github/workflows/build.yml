name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Stage BepInEx libs from vendor zip
        shell: pwsh
        run: |
          # Use the same zip install.cmd will extract at runtime so the
          # CI-built DLL references match the runtime BepInEx version
          # exactly (no 5.4.23.x cross-patch binding surprises).
          $vendorZip = "vendor/bepinex/BepInEx_win_x86.zip"
          if (-not (Test-Path $vendorZip)) {
            Write-Host "::error::Vendored BepInEx zip missing: $vendorZip"
            exit 1
          }

          $libsPath = "src/ObraDinnHeadTracking/libs"
          New-Item -ItemType Directory -Path $libsPath -Force | Out-Null
          Expand-Archive -Path $vendorZip -DestinationPath bepinex-temp -Force
          Copy-Item bepinex-temp/BepInEx/core/BepInEx.dll $libsPath/
          Copy-Item bepinex-temp/BepInEx/core/0Harmony.dll $libsPath/
          Remove-Item -Recurse bepinex-temp

          Write-Host "BepInEx DLLs staged from $vendorZip" -ForegroundColor Green

      - name: Create Unity stub assemblies for CI
        shell: pwsh
        run: |
          Write-Host "Creating Unity stub assemblies for CI build..." -ForegroundColor Cyan

          $libsPath = "src/ObraDinnHeadTracking/libs"

          # Each Unity 2017 module gets its proper slice so the IL emitted by
          # downstream csprojs references types in the same module they live in
          # at runtime (e.g. [UnityEngine.CoreModule]UnityEngine.Camera, not
          # [UnityEngine]UnityEngine.Camera). Compile order is dependency-driven:
          # CoreModule first, then leaf modules referencing it, then UI which
          # needs CoreModule + UIModule + TextRenderingModule.
          # AssemblyVersion 0.0.0.0 matches Unity 2017's runtime DLLs - without
          # this, Mono fails to bind the plugin at load time.

          function Build-StubModule {
              param(
                  [string]$ModuleName,
                  [string]$SourceFile,
                  [string[]]$References
              )
              $refXml = ""
              foreach ($r in $References) {
                  # HintPath is relative to the csproj's directory. The csproj
                  # is generated INTO $libsPath, so the referenced DLL is a
                  # sibling - no path prefix.
                  $refXml += "    <Reference Include=`"$r`"><HintPath>$r.dll</HintPath></Reference>`n"
              }
              $projContent = @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net35</TargetFramework>
              <LangVersion>7.3</LangVersion>
              <AssemblyName>$ModuleName</AssemblyName>
              <AssemblyVersion>0.0.0.0</AssemblyVersion>
              <FileVersion>0.0.0.0</FileVersion>
              <Version>0.0.0.0</Version>
              <NoWarn>CS0169;CS0649;CS0067;CS0660;CS0661</NoWarn>
              <DisableImplicitFrameworkReferences>false</DisableImplicitFrameworkReferences>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="$SourceFile" />
          $refXml  </ItemGroup>
          </Project>
          "@
              $projPath = Join-Path $libsPath "Stub_$ModuleName.csproj"
              $projContent | Out-File -FilePath $projPath -Encoding utf8

              dotnet build $projPath -c Release -o $libsPath --nologo -v q
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "::error::Failed to build $ModuleName stub"
                  exit 1
              }
              Write-Host "  Created $ModuleName.dll" -ForegroundColor Green
              Remove-Item $projPath -ErrorAction SilentlyContinue
          }

          # CoreModule first - everything else may reference its types.
          Build-StubModule -ModuleName "UnityEngine.CoreModule" -SourceFile "UnityStubs.CoreModule.cs" -References @()

          Build-StubModule -ModuleName "UnityEngine.TextRenderingModule" -SourceFile "UnityStubs.TextRenderingModule.cs" -References @("UnityEngine.CoreModule")
          Build-StubModule -ModuleName "UnityEngine.PhysicsModule"       -SourceFile "UnityStubs.PhysicsModule.cs"       -References @("UnityEngine.CoreModule")
          Build-StubModule -ModuleName "UnityEngine.UIModule"            -SourceFile "UnityStubs.UIModule.cs"            -References @("UnityEngine.CoreModule")
          Build-StubModule -ModuleName "UnityEngine.IMGUIModule"         -SourceFile "UnityStubs.IMGUIModule.cs"         -References @("UnityEngine.CoreModule", "UnityEngine.TextRenderingModule")

          # InputLegacyModule slice compiled into BOTH UnityEngine.InputModule.dll
          # (OBRA csproj reference name) and UnityEngine.InputLegacyModule.dll
          # (CameraUnlock.Core.Unity reference name).
          Build-StubModule -ModuleName "UnityEngine.InputModule"       -SourceFile "UnityStubs.InputLegacyModule.cs" -References @("UnityEngine.CoreModule")
          Build-StubModule -ModuleName "UnityEngine.InputLegacyModule" -SourceFile "UnityStubs.InputLegacyModule.cs" -References @("UnityEngine.CoreModule")

          # UnityEngine.dll is near-empty; in real Unity 2017 it's mostly type forwarders.
          Build-StubModule -ModuleName "UnityEngine" -SourceFile "UnityStubs.Engine.cs" -References @()

          # UI references types from CoreModule, UIModule, TextRenderingModule.
          Build-StubModule -ModuleName "UnityEngine.UI" -SourceFile "UnityStubs.UI.cs" -References @("UnityEngine.CoreModule", "UnityEngine.UIModule", "UnityEngine.TextRenderingModule")

          # Cleanup temp files
          Remove-Item (Join-Path $libsPath "*.deps.json") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $libsPath "*.pdb") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $libsPath "obj") -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Unity stub assemblies created successfully" -ForegroundColor Green

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $unityPath = "${{ github.workspace }}\src\ObraDinnHeadTracking\libs"
          dotnet restore src/ObraDinnHeadTracking/ObraDinnHeadTracking.csproj "-p:UnityEnginePath=$unityPath"

      - name: Build Debug
        shell: pwsh
        run: |
          Write-Host "Building debug configuration..." -ForegroundColor Cyan
          $unityPath = "${{ github.workspace }}\src\ObraDinnHeadTracking\libs"
          dotnet build src/ObraDinnHeadTracking/ObraDinnHeadTracking.csproj --configuration Debug "-p:UnityEnginePath=$unityPath"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Debug build failed"
            exit 1
          }

          Write-Host "Debug build succeeded" -ForegroundColor Green

      - name: Build Release
        shell: pwsh
        run: |
          Write-Host "Building release configuration..." -ForegroundColor Cyan
          $unityPath = "${{ github.workspace }}\src\ObraDinnHeadTracking\libs"
          dotnet build src/ObraDinnHeadTracking/ObraDinnHeadTracking.csproj --configuration Release "-p:UnityEnginePath=$unityPath"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Release build failed"
            exit 1
          }

          Write-Host "Release build succeeded" -ForegroundColor Green

      - name: Verify build outputs
        shell: pwsh
        run: |
          Write-Host "Verifying build outputs..." -ForegroundColor Cyan

          $requiredFiles = @(
            "src/ObraDinnHeadTracking/bin/Debug/net35/ObraDinnHeadTracking.dll",
            "src/ObraDinnHeadTracking/bin/Release/net35/ObraDinnHeadTracking.dll"
          )

          $allExist = $true
          foreach ($file in $requiredFiles) {
            if (Test-Path $file) {
              $size = (Get-Item $file).Length / 1KB
              Write-Host "  $file ($([math]::Round($size, 2)) KB)" -ForegroundColor Green
            } else {
              Write-Host "  Missing: $file" -ForegroundColor Red
              $allExist = $false
            }
          }

          if (-not $allExist) {
            Write-Host "::error::Some build outputs are missing"
            exit 1
          }

          Write-Host "All build outputs verified" -ForegroundColor Green

      - name: Package installer
        shell: pwsh
        run: |
          Write-Host "Packaging installer ZIP..." -ForegroundColor Cyan
          powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Packaging failed"
            exit 1
          }

          Write-Host "Package created" -ForegroundColor Green

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ObraDinnHeadTracking-installer
          path: release/*-installer.zip
          retention-days: 14
          if-no-files-found: error

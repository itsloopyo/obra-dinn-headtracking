[Neck Model]

## Enable neck model simulation (head rotates around neck, not eye center)
# Setting type: Boolean
# Default value: true
NeckModelEnabled = true

## Vertical distance from neck pivot to eyes in meters
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 0.25
NeckModelHeight = 0.1

## Forward distance from neck pivot to eyes in meters
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 0.2
NeckModelForward = 0.05

[Network]

## UDP port to listen for OpenTrack data (must match OpenTrack output settings)
# Setting type: Int32
# Default value: 4242
# Acceptable value range: From 1024 to 65535
UDPPort = 4242

[Position]

## Enable positional tracking (lean in/out/side-to-side)
# Setting type: Boolean
# Default value: true
PositionEnabled = true

## Multiplier for lateral (left/right) position
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 3
PositionSensitivityX = 2

## Multiplier for vertical (up/down) position
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 3
PositionSensitivityY = 2

## Multiplier for depth (forward/back) position
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 3
PositionSensitivityZ = 2

## Maximum lateral displacement in meters (prevents wall clipping)
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0.01 to 0.5
PositionLimitX = 0.3

## Maximum vertical displacement in meters
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0.01 to 0.5
PositionLimitY = 0.2

## Maximum depth displacement in meters (prevents wall clipping)
# Setting type: Single
# Default value: 0.4
# Acceptable value range: From 0.01 to 0.5
PositionLimitZ = 0.4

## Smoothing for positional tracking (0 = instant, 1 = very slow)
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 1
PositionSmoothing = 0.15

[Sensitivity]

## Multiplier for horizontal head rotation (left/right)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 3
YawSensitivity = 1

## Multiplier for vertical head rotation (up/down)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 3
PitchSensitivity = 1

## Multiplier for head tilt (ear to shoulder)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 3
RollSensitivity = 1

[Smoothing]

## Base smoothing level (0 = no smoothing, 1 = max smoothing). Higher values reduce jitter but add latency. Remote connections automatically use a minimum of 0.1 for network latency compensation.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
Smoothing = 0

[UI]

## Whether to show notifications when OpenTrack connection is lost or restored
# Setting type: Boolean
# Default value: true
ShowConnectionNotifications = true

## Whether to show the aim reticle during gameplay
# Setting type: Boolean
# Default value: true
ShowReticle = true


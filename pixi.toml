[workspace]
name = "obra-dinn-head-tracking"
version = "1.0.0"
description = "Head tracking mod for Return of the Obra Dinn using CameraUnlock shared library"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
setup-bepinex = "powershell -ExecutionPolicy Bypass -File scripts/setup-libs.ps1"
# Unity reference stubs, compiled from the shared sources in the core submodule.
# net35 means pre-2017.3 Unity, so no UnityEngine.InputLegacyModule is produced -
# Input lives in UnityEngine.dll on that engine version. UnityEngine.InputModule is
# added to the default module set because the csproj references it. No UnityEngine.UI.dll:
# nothing here touches uGUI, and Core.Unity drops CrosshairUtility on net35.
setup-libs = { cmd = 'powershell -ExecutionPolicy Bypass -Command "& cameraunlock-core/csharp/stubs/build-unity-stubs.ps1 -OutputPath src/ObraDinnHeadTracking/libs -TargetFramework net35 -SkipUI -EmptyModule UnityEngine.CoreModule,UnityEngine.IMGUIModule,UnityEngine.UIModule,UnityEngine.TextRenderingModule,UnityEngine.AnimationModule,UnityEngine.PhysicsModule,UnityEngine.InputModule"', depends-on = ["setup-bepinex"] }
restore = { cmd = "dotnet restore src/ObraDinnHeadTracking/ObraDinnHeadTracking.csproj", depends-on = ["setup-libs"] }
build = { cmd = "dotnet build src/ObraDinnHeadTracking/ObraDinnHeadTracking.csproj -c Release", depends-on = ["restore"] }
# Checks that every member reference the build emits resolves against the
# assemblies it binds to at runtime. Stub/engine shape drift (a property
# declared as a field, or the reverse) compiles cleanly and only fails in
# game. Needs the game installed; skips and succeeds without it.
verify-refs = { cmd = "powershell -ExecutionPolicy Bypass -File cameraunlock-core/scripts/verify-assembly-refs.ps1 -GameId obra-dinn -BuildDir src/ObraDinnHeadTracking/bin/Release", depends-on = ["build"] }
# The config tests, among them the differential test in tests/config_differential, which holds
# the legacy import to the v1.3.0 reader it replaces on every published build's first-run file
# and on core's mutation corpus, then core's canonical config lint over the committed file and
# every file the test migrated.
test = { cmd = "dotnet test tests/ObraDinnHeadTracking.Tests/ObraDinnHeadTracking.Tests.csproj -c Release && node tests/config_differential/lint-migrated.mjs tests/ObraDinnHeadTracking.Tests/bin/Release/net48/migrated", depends-on = ["build"] }
# Rewrites config/CameraUnlock.ini from the config table after a change to a row, a comment or a
# default. The render test compares the two on every `pixi run test`, so the committed file cannot
# drift from the code.
render-config = { cmd = "dotnet test tests/ObraDinnHeadTracking.Tests/ObraDinnHeadTracking.Tests.csproj -c Release --filter FullyQualifiedName~ConfigTests.CommittedFileIsTheRenderedDefaults && node cameraunlock-core/scripts/encode-seed.mjs", env = { CAMERAUNLOCK_RENDER_CONFIG = "write" } }
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test"] }
uninstall = "scripts\\uninstall.cmd"
clean = "dotnet clean src/ObraDinnHeadTracking/ObraDinnHeadTracking.csproj"
# Bump vendored mod-loader copies to latest upstream within pinned range.
# Manual; commit the result. CI does not run this.
update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"
# Checks the launcher contract against the built installer ZIP, and that the Nexus ZIP carries
# no config.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"
show-changelog = "powershell -ExecutionPolicy Bypass -File scripts/show-changelog.ps1"
